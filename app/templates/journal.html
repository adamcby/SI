{% extends "base.html" %}
{% block contenu %}
<div x-data="journalFlux()" x-init="init()" class="space-y-4">
  <section class="carte-p" {{ m.insp('FE-01R FI-10 FM-13', 'Filtres du bus d’information : par code de flux, acteur ou processus') }}>
    <div class="grid grid-cols-[1fr_1fr_1fr_auto] items-end gap-3">
      <label class="text-[12px]">Code ou famille de flux<select x-model="code" @change="charger()" class="champ mt-1"><option value="">Tous les flux</option><option value="FE">FE — externes (Fig. 1)</option><option value="FI">FI — internes (Fig. 2)</option><option value="FM">FM — marketing (Fig. 3)</option>
        <template x-for="c in codes"><option :value="c" x-text="c + ' — ' + ref.flux[c].libelle"></option></template></select></label>
      <label class="text-[12px]">Acteur émetteur ou destinataire<select x-model="acteur" @change="charger()" class="champ mt-1"><option value="">Tous</option><template x-for="(a, k) in (ref ? ref.acteurs : {})"><option :value="k" x-text="a.nom"></option></template></select></label>
      <label class="text-[12px]">Processus<select x-model="processus" @change="charger()" class="champ mt-1"><option value="">Tous</option><option value="P1">P1 — précommandes</option><option value="P2">P2 — campagne TikTok</option></select></label>
      <label class="flex items-center gap-2 pb-2 text-[12.5px]"><input type="checkbox" x-model="direct" class="rounded"> en direct</label>
    </div>
  </section>
  <section class="carte p-2" {{ m.insp('FE-01R FI-12', 'Chaque ligne = un message réel (ou un lot) échangé entre deux acteurs') }}>
    <table class="tableau">
      <thead><tr><th>Horodatage (SI)</th><th>Flux</th><th>Émetteur → destinataire</th><th>Objet</th><th>BPMN</th><th class="text-right">Volume</th></tr></thead>
      <tbody><template x-for="f in lignes" :key="f.id">
        <tr :class="nouveaux.includes(f.id) && 'bg-action-soft/40'">
          <td class="tabnum whitespace-nowrap text-ink-3" x-text="SI.fmt.dh(f.horodatage)"></td>
          <td><span class="chip-flux" x-text="f.code"></span></td>
          <td class="whitespace-nowrap text-[12px]"><span x-text="nom(f.emetteur)"></span> <span class="text-ink-4">→</span> <span x-text="nom(f.recepteur)"></span></td>
          <td class="max-w-[520px]" x-text="f.objet"></td>
          <td><span x-show="f.processus" class="chip-tache" x-text="(f.processus || '') + '-' + (f.noeud || '')"></span></td>
          <td class="tabnum text-right" x-text="SI.fmt.n(f.volume)"></td>
        </tr></template></tbody>
    </table>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('journalFlux', () => ({
    ref: null, codes: [], lignes: [], code: '', acteur: '', processus: '', direct: true, nouveaux: [],
    async init() { this.ref = await SI.referentiel(); this.codes = Object.keys(this.ref.flux); await this.charger(); setInterval(() => { if (this.direct) this.charger(true); }, 4000); },
    nom(c) { return (this.ref && this.ref.acteurs[c]) ? this.ref.acteurs[c].court : c; },
    async charger(maj) {
      const q = new URLSearchParams({limite: 120}); if (this.code) q.set('code', this.code); if (this.acteur) q.set('acteur', this.acteur); if (this.processus) q.set('processus', this.processus);
      const l = await SI.get('/api/journal?' + q);
      const anciens = new Set(this.lignes.map(x => x.id));
      this.nouveaux = maj ? l.filter(x => !anciens.has(x.id)).map(x => x.id) : [];
      this.lignes = l; window.dispatchEvent(new CustomEvent('si:rendu'));
    },
  }));
});
</script>
{% endblock %}
