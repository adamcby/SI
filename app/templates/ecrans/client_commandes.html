{% extends "base.html" %}
{% block titre %}Mon compte — mes précommandes{% endblock %}
{% block contenu %}
<div x-data="compteClient()" x-init="init()" class="grid grid-cols-[340px_1fr] gap-6">
  <!-- Liste -->
  <aside class="space-y-3">
    <div class="carte-p">
      <label class="etiquette">Retrouver une précommande</label>
      <form @submit.prevent="ouvrir(recherche)" class="flex gap-2"><input x-model="recherche" class="champ" placeholder="Référence, ex. W104123"><button class="btn-sec">OK</button></form>
    </div>
    <div class="carte p-2" {{ m.insp('FE-01R', 'Précommandes passées pendant la démonstration') }}>
      <div class="sur-titre px-3 pb-1 pt-2">Mes précommandes (démonstration)</div>
      <template x-for="p in liste" :key="p.id">
        <button @click="ouvrir(p.reference)" class="flex w-full items-center justify-between gap-2 rounded-xl px-3 py-2 text-left hover:bg-canvas" :class="detail && detail.id == p.id && 'bg-action-soft'">
          <span><span class="block text-[13px] font-medium" x-text="p.reference + ' · ' + p.libelle_config"></span><span class="block text-[11.5px] text-ink-3" x-text="SI.fmt.dh(p.cree_le)"></span></span>
          <span class="badge" :class="classeStatut(p.statut)" x-text="p.statut_libelle"></span>
        </button>
      </template>
      <div x-show="!liste.length" class="px-3 py-6 text-center texte-doux">Aucune précommande de démonstration.<br><a href="/a/client/configurateur" class="lien">Précommander l'iPhone Duo</a></div>
    </div>
  </aside>

  <!-- Détail -->
  <section>
    <template x-if="detail">
      <div class="space-y-4">
        <div class="carte-p">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="sur-titre">Précommande <span x-text="detail.reference"></span></div>
              <div class="mt-1 text-[22px] font-semibold tracking-tight" x-text="detail.libelle_config"></div>
              <div class="mt-1 text-[13px] text-ink-3" x-text="SI.fmt.eur(detail.prix_ttc + detail.applecare_ttc) + ' TTC · ' + detail.paiement_libelle + (detail.reprise_valeur ? ' · reprise ' + SI.fmt.eur(detail.reprise_valeur) : '')"></div>
            </div>
            <span class="badge !px-3 !py-1 !text-[12.5px]" :class="classeStatut(detail.statut)" x-text="detail.statut_libelle"></span>
          </div>
          <div class="mt-4 flex items-center gap-2 rounded-2xl bg-canvas-2 p-3 text-[13.5px] font-medium ring-1 ring-line-soft" {{ m.insp('P1-T09 P1-E1 FE-01A', 'T09 — le client reçoit la confirmation ; fin du processus : livraison à partir du 23/10') }}>
            {{ m.icone('camion', 'w-5 h-5 text-ink-3') }}<span x-text="detail.delai_affiche || 'Délai communiqué après réservation'"></span>
          </div>
          <div x-show="detail.statut == 'paiement_refuse'" class="mt-3 flex items-center justify-between gap-3 rounded-2xl bg-crit-soft p-3 ring-1 ring-crit/20" {{ m.insp('P1-G01 P1-T01', 'Branche « non » de la passerelle : retour au choix de la configuration') }}>
            <span class="text-[13px] text-crit-ink"><b>Paiement refusé.</b> <span x-text="detail.motif"></span></span>
            <a :href="'/a/client/configurateur?reprendre=' + detail.reference" class="btn-crit btn-petit">Modifier ma configuration</a>
          </div>
        </div>

        <div class="carte-p" {{ m.insp('P1-T01 P1-T03 P1-G01 P1-G02 P1-T08 P1-T09', 'Le client suit sa précommande à travers les couloirs du processus P1') }}>
          {{ m.entete_section('Où en est ma précommande ?', 'Chaque étape correspond à une tâche du BPMN P1, exécutée par l’acteur de son couloir.') }}
          <ol class="relative ml-3 border-l-2 border-line-soft">
            <template x-for="(s, i) in etapes()" :key="i">
              <li class="relative mb-4 pl-6">
                <span class="absolute -left-[11px] top-0.5 flex h-5 w-5 items-center justify-center rounded-full text-white" :class="s.etat == 'fait' ? 'bg-ok-ink' : (s.etat == 'actif' ? 'bg-action' : 'bg-line')">
                  <svg viewBox="0 0 24 24" class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="3"><path :d="s.etat=='fait' ? 'M5 12.5l4.5 4.5L19 7' : 'M12 8v.01M12 12v4'"/></svg></span>
                <div class="flex items-center gap-2"><span class="text-[13.5px] font-medium" x-text="s.titre"></span><span class="chip-tache" x-text="s.code"></span></div>
                <div class="text-[12px] text-ink-3" x-text="s.texte"></div>
              </li>
            </template>
          </ol>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="carte-p" {{ m.insp('FE-01A FE-01R', 'Messages échangés entre Apple et le client') }}>
            {{ m.entete_section('Messages reçus d’Apple', '', 'FE-01A') }}
            <template x-for="f in detail.flux.filter(x => x.recepteur == 'client' || x.code == 'FE-01A')" :key="f.horodatage + f.objet">
              <div class="mb-2 rounded-xl bg-canvas-2 p-2.5 text-[12.5px]"><span class="chip-flux" x-text="f.code"></span> <span x-text="f.objet"></span><div class="text-[11px] text-ink-4" x-text="SI.fmt.dh(f.horodatage)"></div></div>
            </template>
          </div>
          <div class="carte-p" {{ m.insp('FE-11R FE-01R', 'Droits RGPD : consentement modifiable, droit d’accès (export)') }}>
            {{ m.entete_section('Mes données (RGPD)', 'Le client garde la main sur ses données.') }}
            <div class="text-[12.5px] text-ink-2">Identifiant : <span class="font-mono" x-text="detail.apple_id"></span></div>
            <label class="mt-3 flex items-center gap-2 text-[13px]"><input type="checkbox" class="rounded" :checked="consentement" @change="changerConsentement($event.target.checked)"> Recevoir des offres personnalisées</label>
            <a :href="'/api/clients/' + detail.client_id + '/export'" target="_blank" class="btn-sec btn-petit mt-3">{{ m.icone('telecharger', 'w-4 h-4') }} Télécharger mes données (droit d'accès)</a>
          </div>
        </div>
      </div>
    </template>
    <div x-show="!detail" class="carte-p py-16 text-center texte-doux">Sélectionnez une précommande.</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('compteClient', () => ({
    liste: [], detail: null, recherche: '', consentement: true,
    async init() {
      await this.charger();
      const ref = new URLSearchParams(location.search).get('ref');
      if (ref) this.ouvrir(ref); else if (this.liste.length) this.ouvrir(this.liste[0].reference);
      window.addEventListener('si:maj', () => this.charger());
    },
    async charger() { this.liste = await SI.get('/api/precommandes?demo=1&limite=30'); },
    async ouvrir(ref) {
      if (!ref) return;
      try { this.detail = await SI.get('/api/precommandes/' + encodeURIComponent(ref)); this.consentement = true; }
      catch (e) { SI.toast(e.message, 'crit'); }
    },
    classeStatut(s) { return {confirmee: 'badge-ok', paiement_refuse: 'badge-crit', abandonnee: 'badge-neutre'}[s] || 'badge-warn'; },
    etapes() {
      const d = this.detail, faits = new Set(d.chronologie.map(e => e.noeud)), jetons = new Set(d.etat_bpmn.jetons || []);
      const et = (n) => faits.has(n) ? 'fait' : (jetons.has(n) ? 'actif' : 'a_venir');
      const pay = d.statut == 'attente_credit' ? "En attente de la réponse de l'organisme financier (flux FE-09R)" : 'Vérification par la finance';
      return [
        {code: 'P1-T01', titre: 'Configuration choisie', texte: d.libelle_config, etat: et('T01') == 'actif' ? 'actif' : 'fait'},
        {code: 'P1-T02', titre: 'Prix et délai affichés', texte: d.delai_affiche || '', etat: et('T02')},
        {code: 'P1-T03', titre: 'Précommande validée', texte: SI.fmt.dh(d.cree_le), etat: et('T03')},
        {code: 'P1-G01', titre: 'Paiement accepté', texte: faits.has('G01') ? 'Paiement accepté' : pay, etat: d.statut == 'paiement_refuse' ? 'actif' : et('G01')},
        {code: 'P1-G02', titre: 'Stock vérifié par la production', texte: faits.has('T07') ? 'Délai allongé : ' + (d.delai_affiche || '') : '', etat: et('G02')},
        {code: 'P1-T08', titre: 'Appareil réservé', texte: d.livraison_prevue ? 'Lot disponible le ' + SI.fmt.jour(d.livraison_prevue) : '', etat: et('T08')},
        {code: 'P1-T09', titre: 'Confirmation reçue', texte: d.confirme_le ? SI.fmt.dh(d.confirme_le) : '', etat: et('T09')},
      ];
    },
    async changerConsentement(v) {
      this.consentement = v;
      await SI.agir('/api/clients/' + this.detail.client_id + '/consentement', {consentement: v});
    },
  }));
});
</script>
{% endblock %}
