{% extends "base.html" %}
{% block contenu %}
<div x-data="siPartage()" x-init="init()" class="grid grid-cols-[340px_minmax(0,1fr)] gap-5">
  <aside class="carte p-2" {{ m.insp('FI-10 FI-11 FI-12', 'Le SI partagé de la Fig. 2 : CRM + ERP + pilotage, une seule base') }}>
    <template x-for="g in groupes" :key="g[0]">
      <div class="mb-2"><div class="sur-titre px-3 pb-1 pt-2" x-text="g[0]"></div>
        <template x-for="t in g[1]" :key="t.table"><button @click="ouvrir(t.table)" class="flex w-full items-center justify-between rounded-lg px-3 py-1.5 text-left text-[12.5px] hover:bg-canvas" :class="table == t.table && 'bg-action-soft'"><span class="font-mono" x-text="t.table"></span><span class="tabnum text-ink-3" x-text="SI.fmt.n(t.lignes)"></span></button></template></div>
    </template>
  </aside>
  <section class="carte-p min-w-0" {{ m.insp('FI-10', 'Aperçu des enregistrements (identifiants clients pseudonymisés)') }}>
    <div class="mb-3 flex items-end justify-between"><div><div class="titre-carte font-mono" x-text="table"></div><div class="texte-doux" x-text="apercu ? apercu.colonnes.length + ' colonnes · 25 derniers enregistrements' : ''"></div></div>
      <span class="badge badge-info">lecture seule</span></div>
    <div class="overflow-x-auto barre-defilement"><table class="tableau whitespace-nowrap">
      <thead><tr><template x-for="c in (apercu ? apercu.colonnes : [])"><th x-text="c"></th></template></tr></thead>
      <tbody><template x-for="(l, i) in (apercu ? apercu.lignes : [])" :key="i"><tr><template x-for="c in apercu.colonnes"><td class="max-w-[260px] truncate text-[12px]" :title="l[c]" x-text="l[c] === null ? '—' : l[c]"></td></template></tr></template></tbody></table></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('siPartage', () => ({
    groupes: [], table: 'precommandes', apercu: null,
    async init() { const t = await SI.get('/api/si/tables'); const g = {}; t.forEach(x => (g[x.brique] = g[x.brique] || []).push(x)); this.groupes = Object.entries(g); this.ouvrir(this.table); },
    async ouvrir(t) { this.table = t; this.apercu = await SI.get('/api/si/tables/' + t); window.dispatchEvent(new CustomEvent('si:rendu')); },
  }));
});
</script>
{% endblock %}
