{# Espace de travail du processus P2 (Fig. 5) — inclus dans E22 (direction marketing), E23 (réseaux sociaux), E25 (data & CRM) #}
<div x-data="espaceCampagne('{{ focus|default('') }}')" x-init="init()" class="space-y-5">
  <!-- Sélection de la campagne -->
  <section class="carte-p">
    <div class="flex flex-wrap items-center gap-3">
      <div class="min-w-[340px] flex-1">
        <label class="etiquette">Campagne (instance du processus P2)</label>
        <select class="champ" x-model="cid" @change="charger()">
          <template x-for="c in campagnes" :key="c.id"><option :value="c.id" x-text="c.nom + ' — ' + (c.fini ? 'terminée' : 'en cours : ' + c.jetons.join(', '))" :selected="c.id == cid"></option></template>
        </select>
      </div>
      <template x-if="peutCreer">
        <div class="flex items-end gap-2">
          <input x-model="nouveauNom" class="champ w-[300px]" placeholder="Nom de la nouvelle campagne">
          <select x-model="nouveauPays" class="champ w-[120px]"><option value="FR">France</option><option value="DE">Allemagne</option><option value="UK">Royaume-Uni</option><option value="IT">Italie</option><option value="ES">Espagne</option><option value="IN">Inde</option></select>
          <button @click="creer()" class="btn whitespace-nowrap" {{ m.insp('P2-E0 P2-T01', 'Démarrer une nouvelle instance de P2 (événement de début rejoué)') }}>{{ m.icone('plus', 'w-4 h-4') }} Nouvelle campagne</button>
        </div>
      </template>
    </div>
  </section>

  <template x-if="c">
  <div class="space-y-5">
    <!-- En-tête de campagne -->
    <section class="carte-p">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <div class="sur-titre" x-text="'Instance P2 n°' + c.instance_id + ' · ' + c.pays + ' · déclencheur : ' + (c.declencheur || '—')"></div>
          <div class="mt-1 text-[21px] font-semibold tracking-tight" x-text="c.nom"></div>
          <div class="mt-2 flex flex-wrap gap-1.5">
            <span class="badge" :class="c.etat.fini ? 'badge-ok' : 'badge-info'" x-text="c.etat.fini ? 'Processus terminé (Fin)' : 'En cours'"></span>
            <span x-show="c.fige" class="badge badge-warn" title="Des événements existent après l'heure simulée">Historique figé à cette date</span>
            <template x-for="j in c.etat.jetons"><span class="chip-tache !bg-action" x-text="'P2-' + j + ' en attente'"></span></template>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-5 text-right">
          <div><div class="kpi-libelle">Budget proposé</div><div class="text-[19px] font-semibold tabnum" x-text="SI.fmt.eur(c.budget_propose)"></div></div>
          <div><div class="kpi-libelle">Budget accordé</div><div class="text-[19px] font-semibold tabnum" x-text="c.budget_valide_a_date ? SI.fmt.eur(c.budget_valide_a_date) : '—'"></div></div>
          <div><div class="kpi-libelle">Coût d'acquisition</div><div class="text-[19px] font-semibold tabnum" x-text="c.cout_acquisition && c.etat.fini ? SI.fmt.eur(c.cout_acquisition, 2) : '—'"></div></div>
        </div>
      </div>
      <!-- Étapes du BPMN P2 -->
      <div class="mt-5 grid grid-cols-6 gap-2" {{ m.insp('P2-T01 P2-G01 P2-T02 P2-T03 P2-T04 P2-T05 P2-T06 P2-G02 P2-T07 P2-T08 P2-T09 P2-T10', 'Les 12 tâches et passerelles du BPMN P2, avec leur état d’exécution') }}>
        <template x-for="n in ordre" :key="n">
          <button @click="vue = n" class="rounded-xl p-2.5 text-left ring-1 transition"
                  :class="c.etat.jetons.includes(n) ? 'bg-action-soft ring-action/50' : (nbFait(n) ? 'bg-ok-soft/50 ring-ok/20' : 'ring-line-soft')">
            <div class="flex items-center justify-between"><span class="chip-tache" :class="c.etat.jetons.includes(n) && '!bg-action'" x-text="'P2-' + n"></span>
              <span class="text-[10.5px] font-semibold" :class="nbFait(n) ? 'text-ok-ink' : 'text-ink-4'" x-text="nbFait(n) ? '✓' + (nbFait(n) > 1 ? ' ×' + nbFait(n) : '') : ''"></span></div>
            <div class="mt-1 text-[12px] font-medium leading-snug" x-text="lib(n)"></div>
            <div class="mt-0.5 text-[10.5px] text-ink-3" x-text="qui(n)"></div>
          </button>
        </template>
      </div>
    </section>

    <!-- Panneau d'action de la tâche active -->
    <template x-for="j in c.etat.jetons" :key="'act' + j">
      <section class="carte-p ring-2 ring-action/30" {{ m.insp('P2-T01 P2-G01 P2-T02 P2-T03 P2-T06 P2-G02 P2-T07 P2-T08', 'Panneau d’action de la tâche active (contrôle d’accès par couloir)') }}>
        <div class="mb-3 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2"><span class="chip-tache !bg-action" x-text="'P2-' + j"></span><span class="titre-carte" x-text="lib(j)"></span></div>
          <span class="text-[12px] text-ink-3" x-text="'Couloir : ' + qui(j)"></span>
        </div>
        <template x-if="!autorise(j)">
          <div class="flex items-center justify-between gap-3 rounded-xl bg-canvas p-3 text-[13px]">
            <span>Cette tâche relève de <b x-text="qui(j)"></b>. Le SI applique le contrôle d'accès par rôle.</span>
            <button @click="SI.changerActeur(acteurs(j)[0], ecranDe(j))" class="btn btn-petit whitespace-nowrap">Passer à sa vue</button>
          </div>
        </template>
        <template x-if="autorise(j)">
          <div>
            <!-- T01 -->
            <div x-show="j == 'T01'" class="grid grid-cols-[1.3fr_1fr] gap-5">
              <div>
                <div class="sur-titre mb-2">Lignes de budget (flux FI-06 vers la finance)</div>
                <template x-for="(l, i) in lignes" :key="i">
                  <div class="mb-2 flex gap-2"><input x-model="l.canal" class="champ"><input x-model.number="l.montant" type="number" step="10000" class="champ w-[150px] text-right tabnum">
                    <button @click="lignes.splice(i, 1)" class="rounded-full p-2 text-ink-3 hover:bg-canvas">{{ m.icone('croix', 'w-4 h-4') }}</button></div>
                </template>
                <div class="flex items-center justify-between"><button @click="lignes.push({canal: 'Nouveau canal', montant: 50000})" class="text-[12.5px] font-medium text-action-link hover:underline">+ Ajouter une ligne</button>
                  <span class="text-[14px] font-semibold tabnum" x-text="'Total : ' + SI.fmt.eur(totalLignes())"></span></div>
              </div>
              <div>
                <div class="sur-titre mb-2">Objectifs de la campagne</div>
                <div class="grid grid-cols-2 gap-2 text-[12px]">
                  <label>Vues TikTok<input x-model.number="objectifs.vues_tiktok" type="number" class="champ mt-1"></label>
                  <label>Commentaires positifs (%)<input x-model.number="objectifs.sentiment" type="number" class="champ mt-1"></label>
                  <label>Mentions<input x-model.number="objectifs.mentions" type="number" class="champ mt-1"></label>
                  <label>Intention d'achat (%)<input x-model.number="objectifs.intention" type="number" step="0.1" class="champ mt-1"></label>
                </div>
                <button @click="act('proposition', {lignes, objectifs}, 'Budget proposé à la finance (FI-06, FM-01).')" class="btn mt-4 w-full">{{ m.icone('envoi', 'w-4 h-4') }} Proposer à la finance</button>
              </div>
            </div>
            <!-- G01 -->
            <div x-show="j == 'G01'" class="grid grid-cols-[1.3fr_1fr] gap-5">
              <table class="tableau"><thead><tr><th>Canal</th><th class="text-right">Montant</th></tr></thead>
                <tbody><template x-for="l in c.lignes"><tr><td x-text="l.canal"></td><td class="tabnum text-right" x-text="SI.fmt.eur(l.montant)"></td></tr></template>
                  <tr><td class="font-semibold">Total (version <span x-text="c.version_budget"></span>)</td><td class="tabnum text-right font-semibold" x-text="SI.fmt.eur(c.budget_propose)"></td></tr></tbody></table>
              <div>
                <label class="etiquette">Commentaire de la finance</label><textarea x-model="commentaire" rows="3" class="champ" placeholder="Ex. réduire l'achat média de 20 %"></textarea>
                <div class="mt-3 flex gap-2"><button @click="act('validation', {issue: 'non', commentaire}, 'Budget à revoir : retour à P2-T01 (FI-07).')" class="btn-sec flex-1 !text-crit-ink">Non : revoir</button>
                  <button @click="act('validation', {issue: 'oui', commentaire}, 'Budget accordé (FI-07, FM-02).')" class="btn-ok flex-1">Valider le budget</button></div>
              </div>
            </div>
            <!-- T02 -->
            <div x-show="j == 'T02'">
              <p class="mb-2 text-[12.5px] text-ink-3">Vidéos livrées par l'équipe création (FM-10) — ton humoristique, usages du quotidien.</p>
              <div class="grid grid-cols-3 gap-2">
                <template x-for="v in videos" :key="v.titre">
                  <label class="flex cursor-pointer gap-2 rounded-xl p-3 ring-1" :class="v.ok ? 'ring-action bg-action-soft/40' : 'ring-line'"><input type="checkbox" x-model="v.ok" class="mt-0.5 rounded">
                    <span><span class="block text-[13px] font-medium" x-text="v.titre"></span><span class="block text-[11.5px] text-ink-3" x-text="v.concept"></span></span></label>
                </template>
              </div>
              <button @click="act('publication', {videos: videos.filter(v => v.ok)}, 'Vidéos publiées sur TikTok (FE-06A) et brief média envoyé (FE-07A).')" class="btn mt-3">Publier sur TikTok</button>
            </div>
            <!-- T03 -->
            <div x-show="j == 'T03'">
              <p class="mb-2 text-[12.5px] text-ink-3">Appareils de pré-série disponibles : <b x-text="c.appareils_disponibles"></b>. La sélection déclenche une demande à la production (FI-13).</p>
              <div class="max-h-[320px] overflow-y-auto rounded-xl ring-1 ring-line-soft barre-defilement">
                <table class="tableau"><thead><tr><th></th><th>Créateur</th><th>Plateforme</th><th class="text-right">Abonnés</th><th class="text-right">Engagement</th><th>Univers</th></tr></thead>
                  <tbody><template x-for="i in c.catalogue_influenceurs" :key="i.id">
                    <tr><td><input type="checkbox" :value="i.id" x-model.number="selection" class="rounded"></td><td class="font-medium" x-text="i.pseudo"></td><td x-text="i.plateforme"></td>
                      <td class="tabnum text-right" x-text="SI.fmt.compact(i.abonnes)"></td><td class="tabnum text-right" x-text="SI.fmt.pct(i.engagement)"></td><td class="text-[12px] text-ink-3" x-text="i.univers"></td></tr>
                  </template></tbody></table>
              </div>
              <button @click="act('influenceurs', {ids: selection}, 'Influenceurs sélectionnés : la production doit fournir les appareils de test (FI-13).')" :disabled="!selection.length" class="btn mt-3" x-text="'Sélectionner ' + selection.length + ' influenceur(s)'"></button>
            </div>
            <!-- T04 -->
            <div x-show="j == 'T04'" class="flex items-center justify-between gap-3">
              <span class="text-[13px]"><b x-text="c.influenceurs.filter(i => !i.appareil_expedie_le).length"></b> appareil(s) de pré-série à expédier aux influenceurs sélectionnés.</span>
              <button @click="act('appareils', {}, 'Appareils de test expédiés (FE-06A).')" class="btn">Expédier les appareils de test</button>
            </div>
            <!-- T05 -->
            <div x-show="j == 'T05'">
              <p class="text-[13px]">Tâche multi-instance : chaque influenceur publie son avis depuis son portail.</p>
              <div class="mt-2 flex flex-wrap gap-2"><template x-for="i in c.influenceurs"><span class="badge" :class="i.avis_publie_le ? 'badge-ok' : 'badge-warn'" x-text="i.pseudo + (i.avis_publie_le ? ' ✓' : ' — en attente')"></span></template></div>
            </div>
            <!-- T06 -->
            <div x-show="j == 'T06'" class="flex items-center justify-between gap-4">
              <div class="text-[13px] text-ink-2">Collecte des vues, mentions et du sentiment (FM-14) puis tableau de bord (FM-17). Mesure n°<b x-text="(c.mesures.length + 1)"></b>.</div>
              <button @click="act('mesure', {}, 'Mesure enregistrée : tableau de bord transmis à la direction marketing (FM-17).')" class="btn">{{ m.icone('graphique', 'w-4 h-4') }} Mesurer maintenant</button>
            </div>
            <!-- G02 -->
            <div x-show="j == 'G02'" class="grid grid-cols-[1.4fr_1fr] gap-5">
              <table class="tableau"><thead><tr><th>Indicateur</th><th class="text-right">Objectif</th><th class="text-right">Résultat</th><th></th></tr></thead>
                <tbody><template x-for="o in c.comparaison"><tr><td x-text="o.libelle"></td><td class="tabnum text-right" x-text="SI.fmt.n(o.objectif, o.objectif % 1 ? 1 : 0)"></td><td class="tabnum text-right font-medium" x-text="SI.fmt.n(o.resultat, o.resultat % 1 ? 1 : 0)"></td>
                  <td><span class="badge" :class="o.atteint ? 'badge-ok' : 'badge-crit'" x-text="o.atteint ? '✓ Atteint' : '✗ En retard'"></span></td></tr></template></tbody></table>
              <div>
                <div class="rounded-xl bg-canvas p-3 text-[12.5px]">Recommandation du SI : <b x-text="c.comparaison.every(o => o.atteint) ? 'objectifs atteints' : 'ajuster le ciblage et le message'"></b>. La décision reste humaine.</div>
                <div class="mt-3 flex gap-2"><button @click="act('decision', {issue: 'non'}, 'Objectifs non atteints : ajustement demandé (P2-T07).')" class="btn-sec flex-1">Non : ajuster</button>
                  <button @click="act('decision', {issue: 'oui'}, 'Objectifs atteints : envoyer rapport et prévisions (P2-T08).')" class="btn-ok flex-1">Oui : atteints</button></div>
              </div>
            </div>
            <!-- T07 -->
            <div x-show="j == 'T07'" class="grid grid-cols-2 gap-3">
              <label class="text-[12px]">Nouveau ciblage (proposé par la data, FM-15)<input x-model="ciblage" class="champ mt-1"></label>
              <label class="text-[12px]">Nouveau message<input x-model="message" class="champ mt-1"></label>
              <div class="col-span-2 flex justify-end"><button @click="act('ajustement', {ciblage, message}, 'Ciblage et message ajustés (FM-15, FE-07A) : nouvelle mesure à réaliser.')" class="btn">Ajuster et relancer la mesure</button></div>
            </div>
            <!-- T08 -->
            <div x-show="j == 'T08'" class="grid grid-cols-3 gap-3">
              <label class="text-[12px]">Prévision de demande (précommandes)<input x-model.number="prevision" type="number" class="champ mt-1"></label>
              <label class="text-[12px]">Coloris le plus demandé<select x-model="colorisPrincipal" class="champ mt-1"><option value="noir">Titane noir</option><option value="naturel">Titane naturel</option><option value="bleu">Titane bleu</option><option value="blanc">Titane blanc</option></select></label>
              <div class="flex items-end"><button @click="act('rapport', {previsions: {total: prevision, coloris_principal: colorisPrincipal}}, 'Rapport et prévisions envoyés : production (FI-04) et finance (FM-18) notifiées.')" class="btn w-full">Envoyer rapport et prévisions</button></div>
            </div>
            <!-- T09 -->
            <div x-show="j == 'T09'" class="grid grid-cols-3 gap-3">
              <label class="text-[12px]">Coloris à renforcer<select x-model="colorisPlan" class="champ mt-1"><option value="noir">Titane noir</option><option value="naturel">Titane naturel</option><option value="bleu">Titane bleu</option><option value="blanc">Titane blanc</option></select></label>
              <label class="text-[12px]">Quantité supplémentaire<input x-model.number="quantitePlan" type="number" class="champ mt-1"></label>
              <div class="flex items-end"><button @click="act('plan', {coloris: colorisPlan, quantite: quantitePlan}, 'Plan de production ajusté (FI-05).')" class="btn w-full">Ajuster le plan de production</button></div>
            </div>
            <!-- T10 -->
            <div x-show="j == 'T10'" class="flex items-center justify-between gap-3">
              <span class="text-[13px]">Coût d'acquisition = dépenses de la campagne / précommandes attribuées (ou prévues).</span>
              <button @click="act('cac', {}, 'Coût d\'acquisition calculé et transmis (FI-12).')" class="btn">Calculer le coût d'acquisition</button>
            </div>
          </div>
        </template>
      </section>
    </template>

    <!-- Mesures et publications -->
    <div class="grid grid-cols-[1.2fr_1fr] gap-5">
      <section class="carte-p" {{ m.insp('P2-T06 FM-14 FM-17', 'Mesures successives (boucle mesure -> ajustement)') }}>
        {{ m.entete_section('Mesures de la campagne', 'Chaque passage dans la boucle T06 → G02 → T07 crée une nouvelle mesure.', 'P2-T06 FM-17') }}
        <div class="h-[210px]" x-show="c.mesures.length"><canvas :id="'g-mes-' + uid"></canvas></div>
        <table class="tableau mt-3" x-show="c.mesures.length"><thead><tr><th>N°</th><th>Date</th><th class="text-right">Vues</th><th class="text-right">Mentions</th><th class="text-right">Positifs</th><th>Décision</th></tr></thead>
          <tbody><template x-for="mm in c.mesures"><tr><td x-text="mm.numero"></td><td class="tabnum" x-text="SI.fmt.dh(mm.horodatage)"></td><td class="tabnum text-right" x-text="SI.fmt.compact(mm.vues)"></td><td class="tabnum text-right" x-text="SI.fmt.compact(mm.mentions)"></td>
            <td class="tabnum text-right" x-text="SI.fmt.pct(mm.sentiment, 0)"></td><td><span class="badge" :class="mm.objectifs_atteints === 1 ? 'badge-ok' : (mm.objectifs_atteints === 0 ? 'badge-warn' : 'badge-neutre')" x-text="mm.objectifs_atteints === 1 ? 'atteints' : (mm.objectifs_atteints === 0 ? 'ajuster' : '—')"></span></td></tr></template></tbody></table>
        <p x-show="!c.mesures.length" class="py-6 text-center texte-doux">Aucune mesure pour l'instant.</p>
        <template x-if="c.ajustements.length"><div class="mt-3"><div class="sur-titre mb-1">Ajustements (P2-T07)</div>
          <template x-for="a in c.ajustements"><div class="mb-1.5 rounded-xl bg-canvas-2 p-2.5 text-[12.5px]"><b x-text="SI.fmt.jour(a.horodatage)"></b> — <span x-text="a.message"></span> <span class="text-ink-3" x-text="'(ciblage : ' + a.ciblage + ')'"></span></div></template></div></template>
      </section>
      <section class="carte-p" {{ m.insp('FE-06A FE-06R FM-10', 'Publications : vidéos Apple (T02) et avis des influenceurs (T05)') }}>
        {{ m.entete_section('Publications', 'Vidéos @apple (T02) et avis des influenceurs (T05) — vues à date.', 'FE-06A FE-06R') }}
        <div class="max-h-[420px] space-y-1.5 overflow-y-auto barre-defilement pr-1">
          <template x-for="p in c.publications.slice().reverse()" :key="p.id">
            <div class="flex items-center gap-3 rounded-xl p-2 ring-1 ring-line-soft">
              <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-white" :class="p.type == 'video_apple' ? 'bg-ink' : 'bg-s5'"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg></span>
              <span class="min-w-0 flex-1"><span class="block truncate text-[12.5px] font-medium" x-text="p.titre"></span><span class="block text-[11px] text-ink-3" x-text="p.auteur + ' · ' + p.plateforme + ' · ' + SI.fmt.jour(p.publie_le)"></span></span>
              <span class="text-right"><span class="block text-[12.5px] font-semibold tabnum" x-text="SI.fmt.compact(p.vues_a_date)"></span><span class="block text-[10.5px] text-ink-3">vues</span></span>
            </div>
          </template>
          <p x-show="!c.publications.length" class="py-6 text-center texte-doux">Rien de publié pour l'instant.</p>
        </div>
      </section>
    </div>

    <template x-if="c.rapports.length">
      <section class="carte-p" {{ m.insp('P2-T08 FI-04', 'Rapport et prévisions de demande envoyés à la production et à la finance') }}>
        {{ m.entete_section('Rapport de campagne (P2-T08)', '', 'FI-04 FM-18') }}
        <template x-for="r in c.rapports"><div class="text-[13px] text-ink-2"><b x-text="SI.fmt.dh(r.horodatage)"></b> — <span x-text="r.synthese"></span>
          <span class="mt-1 block text-[12px] text-ink-3" x-text="'Prévisions : ' + JSON.stringify(r.previsions).replace(/[{}&quot;]/g, ' ')"></span></div></template>
      </section>
    </template>
  </div>
  </template>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('espaceCampagne', (focus) => ({
    campagnes: [], cid: null, c: null, ref: null, vue: null, uid: Math.random().toString(36).slice(2, 7),
    ordre: ['T01', 'G01', 'T02', 'T03', 'T04', 'T05', 'T06', 'G02', 'T07', 'T08', 'T09', 'T10'],
    lignes: [], objectifs: {}, commentaire: '', videos: [], selection: [], ciblage: 'Possesseurs d\'un iPhone de plus de 3 ans (CRM)',
    message: 'Mettre en avant l\'offre de reprise et le paiement en 10 fois', prevision: 12000, colorisPrincipal: 'noir',
    colorisPlan: 'noir', quantitePlan: 800, nouveauNom: 'Campagne TikTok — démonstration', nouveauPays: 'FR',
    get peutCreer() { return SI.acteur() == 'dir_marketing'; },
    async init() {
      this.ref = await SI.referentiel();
      await this.lister();
      const p = new URLSearchParams(location.search);
      this.cid = +(p.get('c') || 0) || (this.campagnes.find(c => !c.fini) || this.campagnes[0] || {}).id;
      await this.charger();
      window.addEventListener('si:maj', () => { this.lister(); this.charger(); });
    },
    async lister() { this.campagnes = await SI.get('/api/campagnes'); },
    async charger() {
      if (!this.cid) return;
      const c = await SI.get('/api/campagnes/' + this.cid);
      this.c = c;
      this.lignes = (c.lignes.length ? c.lignes : c.canaux_defaut).map(l => ({canal: l.canal, montant: l.montant}));
      this.objectifs = Object.assign({}, c.objectifs);
      this.videos = c.videos_suggerees.map((v, i) => Object.assign({ok: i < 3}, v));
      this.$nextTick(() => this.graphique());
      window.dispatchEvent(new CustomEvent('si:rendu'));
    },
    graphique() {
      if (!this.c || !this.c.mesures.length) return;
      const ms = this.c.mesures;
      SI.graphique('g-mes-' + this.uid, 'bar', ms.map(x => 'Mesure ' + x.numero), [
        {nom: 'Commentaires positifs (%)', valeurs: ms.map(x => x.sentiment)},
      ], {formatVal: v => SI.fmt.pct(v, 0), formatAxe: v => v + ' %', zero: true, max: 100});
    },
    noeud(n) { return this.ref ? this.ref.processus.P2.noeuds[n] : {}; },
    lib(n) { return (this.noeud(n).libelle || n).replace(/\n/g, ' '); },
    acteurs(n) { return this.noeud(n).acteurs || []; },
    qui(n) { return this.acteurs(n).map(a => this.ref.acteurs[a].court).join(' / '); },
    ecranDe(n) { const e = this.ref.ecrans.find(x => x.code == this.noeud(n).ecran); return e ? e.slug : ''; },
    autorise(n) { return this.acteurs(n).includes(SI.acteur()) && !this.c.fige; },
    nbFait(n) { return this.c ? this.c.evenements.filter(e => e.noeud == n && !e.partiel).length : 0; },
    totalLignes() { return this.lignes.reduce((a, l) => a + (+l.montant || 0), 0); },
    async creer() {
      const r = await SI.agir('/api/campagnes', {nom: this.nouveauNom, pays: this.nouveauPays}, 'Nouvelle instance du processus P2 créée.');
      await this.lister(); this.cid = r.id; await this.charger();
    },
    async act(action, corps, msg) {
      try { await SI.agir('/api/campagnes/' + this.cid + '/' + action, corps, msg); this.selection = []; this.commentaire = ''; } catch (e) { /* toast affiché */ }
    },
  }));
});
</script>
